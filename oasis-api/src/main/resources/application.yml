spring:
  application:
    name: oasis-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

  jackson:
    time-zone: Asia/Bangkok
    deserialization:
      fail-on-unknown-properties: true

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
    baseline-version: 1

  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${OASIS_COOKIE_SECURE:true}
oasis:
  cancellation-minutes: ${OASIS_CANCELLATION_MINUTES:120}
  notifications:
    worker-enabled: ${OASIS_NOTIFICATION_WORKER_ENABLED:true}
    worker-delay-ms: ${OASIS_NOTIFICATION_WORKER_DELAY_MS:10000}

logging:
  level:
    org.hibernate.orm.jdbc.error: ERROR
